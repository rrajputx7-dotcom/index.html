<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Congratulations Bro! 50K Followers</title>
<meta name="theme-color" content="#ffe4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --p50:#fff5f9; --p100:#ffe4ef; --p200:#ffc9de; --p300:#ffa6c9;
    --p400:#f77fb0; --p500:#ec5c97; --p700:#b83068;
    --script:'Dancing Script','Brush Script MT',cursive;
    --sans:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);color:var(--p700);overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%,#fff 0%,var(--p50) 38%,var(--p100) 100%);
    -webkit-tap-highlight-color:transparent;
  }
  .screen{position:fixed;inset:0;display:grid;place-items:center;padding:20px;
    padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

  /* ---------- Gift card ---------- */
  #gift-screen{z-index:20;transition:opacity .9s ease,visibility .9s}
  #gift-screen.gone{opacity:0;visibility:hidden}
  .gift-wrap{text-align:center}
  .gift{
    width:min(86vw,340px);aspect-ratio:1.6;position:relative;perspective:1000px;cursor:pointer;
    animation:bob 2.6s ease-in-out infinite;border:0;background:none;display:block;margin:0 auto;
  }
  .gift.open{animation:none}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-12px) rotate(1.2deg)}}
  .card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.9,.3,1)}
  .gift.open .card{transform:rotateY(180deg) scale(1.06);transition-delay:.55s}
  .face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
  .front{
    background:linear-gradient(135deg,var(--p200),var(--p400));
    box-shadow:0 26px 50px -12px rgba(184,48,104,.45),inset 0 0 0 3px rgba(255,255,255,.55);
  }
  .front::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);
    transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  .rib{position:absolute;background:linear-gradient(90deg,var(--p50),#fff,var(--p100));
    box-shadow:0 0 12px rgba(184,48,104,.25);transition:transform .55s ease-in}
  .rib-v{left:50%;top:0;bottom:0;width:34px;margin-left:-17px;transform-origin:top}
  .rib-h{top:50%;left:0;right:0;height:34px;margin-top:-17px;transform-origin:left;
    background:linear-gradient(180deg,var(--p50),#fff,var(--p100))}
  .gift.open .rib-v{transform:scaleY(0)}
  .gift.open .rib-h{transform:scaleX(0)}
  .bow{position:absolute;left:50%;top:50%;width:112px;margin:-56px 0 0 -56px;
    transition:transform .6s ease-in,opacity .5s ease-in;filter:drop-shadow(0 6px 8px rgba(184,48,104,.35))}
  .gift.open .bow{transform:translateY(-70px) rotate(25deg) scale(.6);opacity:0}
  .back{
    transform:rotateY(180deg);background:#fff;display:grid;place-items:center;text-align:center;padding:18px;
    box-shadow:0 26px 50px -12px rgba(184,48,104,.4),inset 0 0 0 4px var(--p200);
  }
  .back b{display:block;font-family:var(--script);font-size:clamp(2.2rem,11vw,3rem);color:var(--p500);line-height:1.1}
  .back span{display:block;margin-top:6px;font-size:1rem;color:var(--p700)}
  .tap-hint{margin-top:34px;font-size:1.1rem;letter-spacing:.02em;color:var(--p700);animation:pulse 1.6s ease-in-out infinite}
  .tap-hint.hide{opacity:0;transition:opacity .3s}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* ---------- Main celebration ---------- */
  #main{z-index:10;opacity:0;visibility:hidden}
  #main.show{visibility:visible;opacity:1}
  .flowers{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .flower{position:absolute;bottom:-90px;animation:rise linear infinite;opacity:0}
  @keyframes rise{
    0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
    10%{opacity:.9}
    90%{opacity:.9}
    100%{transform:translate3d(var(--dx),-115vh,0) rotate(var(--rot));opacity:0}
  }
  .stage{position:relative;z-index:5;text-align:center;width:min(92vw,560px)}
  .halo{position:absolute;left:50%;top:50%;width:min(120vw,620px);aspect-ratio:1;transform:translate(-50%,-52%);
    z-index:-1;opacity:.55;animation:spin 40s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-52%) rotate(360deg)}}
  .reveal{opacity:0;transform:translateY(24px) scale(.96)}
  #main.show .reveal{animation:pop .9s cubic-bezier(.2,1.2,.3,1) forwards;animation-delay:calc(var(--i) * .22s + .15s)}
  @keyframes pop{to{opacity:1;transform:none}}
  h1{font-family:var(--script);font-weight:700;font-size:clamp(2.7rem,13.5vw,4.8rem);line-height:1.05;color:var(--p500);
    text-shadow:0 3px 0 #fff,0 10px 24px rgba(236,92,151,.35)}
  .count{font-weight:700;font-size:clamp(3.6rem,19vw,7.2rem);line-height:1;margin-top:10px;color:var(--p700);
    font-variant-numeric:tabular-nums;text-shadow:0 4px 0 #fff,0 14px 30px rgba(184,48,104,.25)}
  .label{font-size:clamp(1.15rem,5vw,1.5rem);font-weight:600;margin-top:6px;color:var(--p500)}
  .note{margin:16px auto 0;max-width:30ch;font-size:1.05rem;line-height:1.45;color:var(--p700)}
  .id{
    display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:13px 22px;border-radius:999px;
    background:#fff;color:var(--p700);text-decoration:none;font-weight:600;font-size:1.15rem;
    box-shadow:0 12px 26px -8px rgba(184,48,104,.45),inset 0 0 0 2px var(--p200);transition:transform .2s;
  }
  .id:hover{transform:translateY(-3px)}
  .id svg{width:24px;height:24px;flex:none}
  .again{
    display:block;margin:16px auto 0;border:0;background:transparent;color:var(--p700);font:inherit;font-size:1rem;
    padding:10px 18px;border-radius:999px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--p300);
  }
  .again:hover{background:var(--p100)}
  :focus-visible{outline:3px solid var(--p500);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){
    .gift,.halo,.flower,.tap-hint,.front::before{animation:none!important}
    .flower{opacity:.7;bottom:auto;top:calc(var(--y) * 1%)}
    #main.show .reveal{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<!-- 1. Gift card -->
<section class="screen" id="gift-screen">
  <div class="gift-wrap">
    <button class="gift" id="gift" aria-label="Open the gift card">
      <div class="card">
        <div class="face front">
          <div class="rib rib-v"></div>
          <div class="rib rib-h"></div>
          <svg class="bow" viewBox="0 0 120 100" aria-hidden="true">
            <path d="M60 52C38 18 6 12 8 38c2 24 36 20 52 14z" fill="#fff5f9" stroke="#ffc9de" stroke-width="3"/>
            <path d="M60 52C82 18 114 12 112 38c-2 24-36 20-52 14z" fill="#fff5f9" stroke="#ffc9de" stroke-width="3"/>
            <path d="M60 54L36 92l16-6 8-14 8 14 16 6z" fill="#ffe4ef" stroke="#ffc9de" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="60" cy="50" r="12" fill="#f77fb0" stroke="#fff" stroke-width="3"/>
          </svg>
        </div>
        <div class="face back">
          <div>
            <b>Surprise!</b>
            <span>Ye gift card sirf tere liye, bro</span>
          </div>
        </div>
      </div>
    </button>
    <p class="tap-hint" id="hint">Tap karke gift kholo</p>
  </div>
</section>

<!-- 2. Celebration -->
<section class="screen" id="main" aria-live="polite">
  <div class="flowers" id="flowers" aria-hidden="true"></div>
  <div class="stage">
    <svg class="halo" viewBox="-100 -100 200 200" aria-hidden="true" id="halo"></svg>
    <h1 class="reveal" style="--i:0">Congratulations Bro!</h1>
    <div class="count reveal" style="--i:1" id="count">0</div>
    <div class="label reveal" style="--i:2">Followers complete</div>
    <p class="note reveal" style="--i:3">Tu legend hai. Ye 50K ka sapna poora hua, aise hi chamakta reh!</p>
    <a class="id reveal" style="--i:4" target="_blank" rel="noopener"
       href="https://www.instagram.com/legend_hero143?stkn=N3MyMGhmYnE2M3V4">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ec5c97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="#ec5c97" stroke="none"/>
      </svg>
      @legend_hero143
    </a>
    <button class="again reveal" style="--i:5" id="again">Dobara celebrate karo</button>
  </div>
</section>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PINKS = ['#ffc9de','#ffa6c9','#f77fb0','#ec5c97','#ffe4ef','#ffffff','#d6457f'];
  var rand = function(a,b){return a + Math.random()*(b-a)};
  var pick = function(arr){return arr[Math.floor(Math.random()*arr.length)]};

  /* ---------- SVG flower (drawn, not an emoji) ---------- */
  function flowerSVG(size, c1, c2, c3){
    var petals = '';
    for(var i=0;i<6;i++){
      petals += '<ellipse cx="0" cy="-17" rx="9" ry="16" fill="'+c1+'" stroke="'+c2+'" stroke-width="1.2" transform="rotate('+(i*60)+')"/>';
    }
    return '<svg width="'+size+'" height="'+size+'" viewBox="-40 -40 80 80">'+petals+
           '<circle r="9" fill="'+c3+'" stroke="#fff" stroke-width="2"/></svg>';
  }

  /* Rising flowers */
  var box = document.getElementById('flowers');
  var combos = [['#ffc9de','#f77fb0','#ec5c97'],['#ffe4ef','#ffa6c9','#f77fb0'],['#ffa6c9','#ec5c97','#fff5f9'],['#ffffff','#ffc9de','#ec5c97']];
  var N = window.innerWidth < 600 ? 14 : 24;
  for(var i=0;i<N;i++){
    var d = document.createElement('div'), c = pick(combos), s = Math.round(rand(30,72));
    d.className = 'flower';
    d.style.left = rand(0,96)+'%';
    d.style.setProperty('--y', rand(5,90));
    d.style.setProperty('--dx', rand(-60,60)+'px');
    d.style.setProperty('--rot', rand(-300,300)+'deg');
    d.style.animationDuration = rand(8,16)+'s';
    d.style.animationDelay = (-rand(0,16))+'s';
    d.innerHTML = flowerSVG(s,c[0],c[1],c[2]);
    box.appendChild(d);
  }

  /* Big rotating flower halo behind the text */
  var halo = document.getElementById('halo'), h = '';
  for(var k=0;k<12;k++){
    h += '<ellipse cx="0" cy="-62" rx="16" ry="34" fill="'+(k%2?'#ffe4ef':'#ffc9de')+'" stroke="#fff" stroke-width="1.5" transform="rotate('+(k*30)+')"/>';
  }
  halo.innerHTML = h + '<circle r="46" fill="#fff5f9" stroke="#ffc9de" stroke-width="2"/>';

  /* ---------- Confetti canvas (hearts, petals, dots) ---------- */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d'), parts = [], running = false;
  function size(){
    var r = window.devicePixelRatio || 1;
    cv.width = innerWidth*r; cv.height = innerHeight*r; ctx.setTransform(r,0,0,r,0,0);
  }
  size(); addEventListener('resize', size);

  function burst(x, y, n){
    if(reduce) n = Math.round(n/4);
    for(var i=0;i<n;i++){
      var a = rand(0, Math.PI*2), sp = rand(4,15);
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rand(3,8),
        s:rand(6,14),rot:rand(0,6.28),vr:rand(-.2,.2),c:pick(PINKS),
        t:pick(['heart','petal','dot']),life:rand(110,200)});
    }
    if(!running){running = true; requestAnimationFrame(tick)}
  }
  function rain(){
    for(var i=0;i<3;i++){
      parts.push({x:rand(0,innerWidth),y:-12,vx:rand(-1,1),vy:rand(2,4),
        s:rand(6,12),rot:rand(0,6.28),vr:rand(-.1,.1),c:pick(PINKS),
        t:pick(['heart','petal','dot']),life:rand(160,260)});
    }
    if(!running){running = true; requestAnimationFrame(tick)}
  }
  function drawHeart(s){
    ctx.beginPath(); ctx.moveTo(0,s*.35);
    ctx.bezierCurveTo(-s*1.1,-s*.4,-s*.55,-s*1.1,0,-s*.5);
    ctx.bezierCurveTo(s*.55,-s*1.1,s*1.1,-s*.4,0,s*.35); ctx.fill();
  }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i];
      p.vx *= .985; p.vy = p.vy*.985 + .22; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      if(p.life<=0 || p.y>innerHeight+30){parts.splice(i,1); continue}
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1,p.life/40); ctx.fillStyle = p.c;
      if(p.t==='heart') drawHeart(p.s);
      else if(p.t==='petal'){ctx.beginPath(); ctx.ellipse(0,0,p.s*.45,p.s,0,0,6.28); ctx.fill()}
      else {ctx.beginPath(); ctx.arc(0,0,p.s*.4,0,6.28); ctx.fill()}
      ctx.restore();
    }
    if(parts.length) requestAnimationFrame(tick); else {running = false; ctx.clearRect(0,0,innerWidth,innerHeight)}
  }

  /* ---------- Counter ---------- */
  function countUp(){
    var el = document.getElementById('count'), target = 50000, dur = reduce ? 1 : 3400, t0 = null;
    function step(t){
      if(!t0) t0 = t;
      var p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = Math.round(target*e).toLocaleString('en-IN');
      if(p<1) requestAnimationFrame(step); else burst(innerWidth/2, innerHeight*.4, 120);
    }
    requestAnimationFrame(step);
  }

  /* ---------- Flow: gift -> celebration ---------- */
  var gift = document.getElementById('gift'), hint = document.getElementById('hint'), opened = false;
  gift.addEventListener('click', function(){
    if(opened) return; opened = true;
    gift.classList.add('open'); hint.classList.add('hide');
    var r = gift.getBoundingClientRect();
    setTimeout(function(){ burst(r.left+r.width/2, r.top+r.height/2, 90) }, 900);
    setTimeout(function(){
      document.getElementById('gift-screen').classList.add('gone');
      document.getElementById('main').classList.add('show');
      burst(innerWidth*.2, innerHeight*.75, 70); burst(innerWidth*.8, innerHeight*.75, 70);
      countUp();
      var n = 0, iv = setInterval(function(){ rain(); if(++n>140) clearInterval(iv) }, 45);
    }, 2600);
  });
  document.getElementById('again').addEventListener('click', function(){
    burst(innerWidth*.15, innerHeight*.8, 80); burst(innerWidth*.85, innerHeight*.8, 80); burst(innerWidth*.5, innerHeight*.5, 100);
  });
})();
</script>
</body>
  </html>
